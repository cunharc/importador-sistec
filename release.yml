name: Build and Release Executable

on:
  push:
    tags:
      - 'v*' # O fluxo só será executado quando você empurrar uma tag que comece com "v" (ex: v2.2.0)

jobs:
  build-and-release:
    name: Compilar e Lançar
    runs-on: windows-latest # Usa uma máquina Windows do GitHub para compilar o .exe

    steps:
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Você pode ajustar para 3.8 se preferir
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Compilar o Executável com PyInstaller
        run: |
          # Adapte os arquivos extras conforme a sua necessidade (ícone, etc)
          pyinstaller --noconfirm --noconsole --name "Importador_Sistec" --add-data "sistec.jpg;." main.py

      - name: 🗜️ Criar arquivo ZIP
        run: |
          # Entra na pasta gerada pelo PyInstaller, zipa o executável e todos os arquivos adicionais soltos
          cd dist
          Compress-Archive -Path Importador_Sistec.exe -DestinationPath atualizacao_sistec.zip

      - name: 🚀 Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: dist/atualizacao_sistec.zip
          name: Release ${{ github.ref_name }}
          body: "Lançamento automatizado da versão ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}